[package]
name = "rfetch"
version = "0.1.0"
edition = "2024"
description = "A fast, live system info TUI with a built-in config editor"
license = "MIT"
repository = "https://github.com/Mo252010/rfetch"
homepage = "https://github.com/Mo252010/rfetch"
readme = "README.md"
keywords = ["tui", "system-info", "neofetch", "sysinfo", "terminal"]
categories = ["command-line-utilities"]
exclude = ["packaging/", ".github/"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
nvml-wrapper = "0.13.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
toml = "1.1.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
